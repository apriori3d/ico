<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ICO Live Board</title>
<style>
  :root {
    --bg: #f6f6f3; --card: #ffffff; --text: #1d1d1b; --muted: #6d6d67;
    --line: #e2e2dc; --track: #ebebe5; --bar: #3b6fd8; --chip: #f0f0ea;
    --ok: #2f8a4c; --fail: #c4412f; --run: #3b6fd8;
    --fn: #97683f; --type: #2f6fb0; --class: #0052cc; --keyword: #b31fb3;
    --dimmed: #8c8c86; --meta: #0a7fc0; --textc: #2f8a46; --string: #c41a1a;
    --signature: #0e7c86; --semantic: #7a3ff0; --tree: #a6a6a0;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1e1e1c; --text: #ecece8; --muted: #9b9b94;
      --line: #2f2f2c; --track: #2a2a27; --bar: #6d97ee; --chip: #292926;
      --ok: #5cbf7a; --fail: #ec7a68; --run: #6d97ee;
      --fn: #c39a72; --type: #569cd6; --class: #6ea8ff; --keyword: #e85ae8;
      --dimmed: #8f8f88; --meta: #4fc1ff; --textc: #4eb169; --string: #f06a6a;
      --signature: #3fd0d8; --semantic: #a07cf8; --tree: #66665f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 18px; margin: 0; font-weight: 650; }
  #conn { color: var(--muted); font-size: 12px; }
  #conn.lost { color: var(--fail); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }

  .run {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 14px;
  }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .state {
    font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em;
    padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor;
  }
  .state.running { color: var(--run); }
  .state.done { color: var(--ok); }
  .state.failed { color: var(--fail); }
  .title { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .summary { margin-top: 10px; color: var(--muted); font-size: 13px; }
  .error {
    margin-top: 10px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap;
    color: var(--fail); overflow-wrap: anywhere;
  }

  .bars { margin-top: 12px; display: grid; gap: 8px; }
  .bar {
    display: grid; grid-template-columns: minmax(90px, 220px) 1fr auto;
    align-items: center; gap: 10px; font-variant-numeric: tabular-nums;
  }
  .bar .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .fill { height: 100%; background: var(--bar); transition: width .3s; }
  .fill.full { background: var(--ok); }
  .fill.unknown { width: 100%; opacity: .3; }
  .nums { color: var(--muted); font-size: 12px; white-space: nowrap; }

  details.plan { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  details.plan > summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .graph { margin-top: 8px; overflow-x: auto; }

  table.plan {
    border-collapse: collapse; font-family: var(--mono); font-size: 12.5px; line-height: 1.3;
  }
  table.plan th {
    text-align: left; font-weight: 600; color: var(--muted); padding: 0 28px 4px 0;
    font-family: system-ui, -apple-system, sans-serif; font-size: 12px;
  }
  table.plan td { padding: 0 28px 0 0; white-space: pre; vertical-align: top; }
  table.plan tr:hover td { background: var(--chip); }
  table.plan th { white-space: nowrap; }
  table.plan th.num, table.plan td.num { text-align: right; padding: 0 10px; }
  table.plan td.num { color: var(--muted); font-variant-numeric: tabular-nums; }
  table.plan td.self { color: var(--text); }
  table.plan tr.hot td.self { color: var(--fail); font-weight: 600; }
  table.plan td.reloaded { color: var(--fail); font-weight: 600; }
  table.plan td.info { text-align: left; }
  .s-fn { color: var(--fn); }
  .s-type { color: var(--type); }
  .s-class_ { color: var(--class); }
  .s-keyword { color: var(--keyword); }
  .s-dimmed { color: var(--dimmed); }
  .s-meta { color: var(--meta); }
  .s-text { color: var(--textc); }
  .s-string { color: var(--string); }
  .s-signature { color: var(--signature); }
  .s-semantic_meta { color: var(--semantic); font-style: italic; }
  .s-group, .s-tree { color: var(--tree); }
  .dim { opacity: .55; }

  @media (max-width: 560px) {
    .bar { grid-template-columns: 1fr auto; }
    .track { grid-column: 1 / -1; grid-row: 2; }
  }
</style>
</head>
<body>
<main>
  <header><h1>ICO Live Board</h1><span id="conn">connecting…</span></header>
  <div id="runs"></div>
</main>
<script>
"use strict";

// All data access goes through this adapter, so that the page can be hosted
// elsewhere (e.g. as an MCP App) by replacing getStatus, getPlan and
// getProfile.
const token = new URLSearchParams(location.search).get("token") || "";
async function getJson(path) {
  const sep = path.includes("?") ? "&" : "?";
  const response = await fetch(path + sep + "token=" + encodeURIComponent(token), {
    cache: "no-store",
  });
  if (!response.ok) throw new Error("HTTP " + response.status);
  return response.json();
}
const getStatus = () => getJson("api/runs");
const getPlan = (runId) => getJson("api/plan?run=" + encodeURIComponent(runId));
const getProfile = (runId) => getJson("api/profile?run=" + encodeURIComponent(runId));
const getResources = (runId) => getJson("api/resources?run=" + encodeURIComponent(runId));
const RESOURCE_COLUMNS = [
  ["resource", "Resource"], ["process", "Process"], ["uses", "Uses"], ["in_use", "In use"],
  ["loads", "Loads"], ["load", "Load"], ["moves", "Moves"], ["move", "Move"],
  ["reloads", "Reloads"], ["size", "Size"], ["on", "On"],
];

// Loaded models of a profiled run, styled as operators in the plan,
// ref(name=value, ...): the reference and the brackets as a name, its fields
// as arguments; reloads in red (the RAM budget is too small).
const RESOURCE_STYLES = { process: "s-text", on: "s-signature" };

function renderResourceName(row) {
  const td = el("td");
  const args = row.args || [];
  if (!args.length) {
    td.append(el("span", "s-text", row.ref || row.resource));
    return td;
  }
  td.append(el("span", "s-text", row.ref + "("));
  td.append(el("span", "s-fn", args.map(([name, value]) => name + "=" + value).join(", ")));
  td.append(el("span", "s-text", ")"));
  return td;
}

function renderResources(rows) {
  const table = el("table", "plan");
  const head = el("tr");
  RESOURCE_COLUMNS.forEach(([key, name]) =>
    head.append(el("th", ["resource", "process", "on"].includes(key) ? "" : "num", name)));
  table.append(head);
  for (const row of rows) {
    const tr = el("tr");
    RESOURCE_COLUMNS.forEach(([key]) => {
      if (key === "resource") return tr.append(renderResourceName(row));
      const cell = el("td", RESOURCE_STYLES[key] || "num", row[key]);
      if (key === "reloads" && row[key] !== "0") cell.className = "num reloaded";
      tr.append(cell);
    });
    table.append(tr);
  }
  return table;
}

const POLL_MS = 1000;
const plans = new Map();     // run id → plan view (fetched once)
const profiles = new Map();  // run id → {state, cells}: refetched while running and once after
const PROFILE_COLUMNS = [
  ["self", "Self"], ["total", "Total"], ["share", "Share of work"], ["cpu", "CPU"],
  ["count", "Count"], ["p95", "p95"], ["info", "Info"],
];
const openPlans = new Set(); // run ids whose plan is expanded
let newestSeen = null;

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function num(value) {
  if (value === null || value === undefined) return "";
  return Number.isInteger(value) ? String(value) : value.toFixed(1);
}

function duration(seconds) {
  if (seconds === null || seconds === undefined) return "";
  if (seconds < 60) return seconds.toFixed(seconds < 10 ? 1 : 0) + "s";
  const m = Math.floor(seconds / 60), s = Math.round(seconds % 60);
  if (m < 60) return m + "m " + s + "s";
  return Math.floor(m / 60) + "h " + (m % 60) + "m";
}

// ─── Progress bars ───

function renderBar(node) {
  const row = el("div", "bar");
  row.append(el("div", "label", node.label));
  const track = el("div", "track");
  const fill = el("div", "fill");
  if (node.total > 0) {
    const share = Math.min(1, node.done / node.total);
    fill.style.width = 100 * share + "%";
    if (share >= 1) fill.classList.add("full");
  } else {
    fill.classList.add("unknown");
  }
  track.append(fill);
  row.append(track);
  const parts = [node.total > 0 ? num(node.done) + "/" + num(node.total) : num(node.done)];
  if (node.rate) parts.push(num(node.rate) + "/s");
  if (node.eta) parts.push("eta " + duration(node.eta));
  row.append(el("div", "nums", parts.join(" · ")));
  return row;
}

// ─── Plan: the console plan rows, colored by DescribeStyle role ───
// Node kinds are unknown here: rows and styles come from the server.

function renderCell(cell, tag) {
  const td = el(tag);
  cell.forEach((segment) => {
    let cls = segment.style ? "s-" + segment.style : "";
    if (segment.dim) cls += " dim";
    td.append(el("span", cls.trim() || null, segment.text));
  });
  return td;
}

// The profile joins the plan rows by plan key (plan.keys).
function renderProfileCells(tr, cells) {
  PROFILE_COLUMNS.forEach(([field]) => {
    const td = el("td", "num " + field, cells ? cells[field] : "");
    if (cells && field === "self" && cells.share_value > 0) {
      // The share of work as a bar behind the self time, from the right.
      const pct = Math.max(2, Math.round(100 * cells.share_value)) + "%";
      td.style.backgroundImage =
        "linear-gradient(to left, var(--track) " + pct + ", transparent " + pct + ")";
    }
    tr.append(td);
  });
  if (cells && cells.hot) tr.classList.add("hot");
}

function renderPlanTable(plan, profile) {
  const table = el("table", "plan");
  const head = el("tr");
  // The profile follows the flow column: Flow, profile, Signature, Name.
  plan.columns.forEach((name, c) => {
    head.append(el("th", null, name));
    if (profile && c === 0) PROFILE_COLUMNS.forEach(([, n]) => head.append(el("th", "num", n)));
  });
  const thead = el("thead");
  thead.append(head);
  const body = el("tbody");
  plan.rows.forEach((row, i) => {
    const tr = el("tr");
    row.forEach((cell, c) => {
      tr.append(renderCell(cell, "td"));
      if (profile && c === 0) {
        const key = plan.keys ? plan.keys[i] : null;
        renderProfileCells(tr, key !== null ? profile[key] : null);
      }
    });
    body.append(tr);
  });
  table.append(thead, body);
  return table;
}

// The plan block of a card is created once; polls only update it.
function createPlan(run) {
  const details = el("details", "plan");
  const summary = el("summary");
  const graph = el("div", "graph");
  details.append(summary, graph);
  const view = { details, summary, graph, run, loading: false, shown: null };
  // Handle the click itself, not the "toggle" event: toggle fires later,
  // and a poll may have updated the card by then, losing the state.
  summary.addEventListener("click", (event) => {
    event.preventDefault();
    const id = view.run.id;
    if (openPlans.has(id)) openPlans.delete(id); else openPlans.add(id);
    details.open = openPlans.has(id);
    if (details.open) fillPlan(view);
  });
  return view;
}

function updatePlan(view, run) {
  view.run = run;
  const title = run.has_profile ? "Pipeline · profile" : "Pipeline";
  if (view.summary.textContent !== title) view.summary.textContent = title;
  view.details.open = openPlans.has(run.id);
  if (view.details.open) fillPlan(view);
}

// Fetches what is missing or may have changed, and swaps the table only
// when its data did change: the shown table stays until then, so the plan
// never blinks.
async function fillPlan(view) {
  if (view.loading) return;
  view.loading = true;
  const run = view.run;
  try {
    if (!plans.has(run.id)) plans.set(run.id, await getPlan(run.id));
    const cached = profiles.get(run.id);
    if (run.has_profile && (run.state === "running" || !cached || cached.state !== run.state)) {
      const [cells, resources] = await Promise.all([getProfile(run.id), getResources(run.id)]);
      profiles.set(run.id, { state: run.state, cells, resources });
    }
    const plan = plans.get(run.id);
    const profile = profiles.has(run.id) ? profiles.get(run.id).cells : null;
    const resources = profiles.has(run.id) ? profiles.get(run.id).resources : null;
    const shown = JSON.stringify([plan, profile, resources]);
    if (shown !== view.shown) {
      view.shown = shown;
      const parts = [plan ? renderPlanTable(plan, profile) : el("div", "kind", "no plan")];
      if (resources && resources.length) parts.push(el("div", "kind", "Resources"), renderResources(resources));
      view.graph.replaceChildren(...parts);
    }
  } finally {
    view.loading = false;
  }
}

// ─── Runs: one card per run, kept between polls and updated in place ───

const cards = new Map(); // run id → {card, live, plan}

// The parts of a card that change with every poll; cheap to rebuild.
function renderLive(run) {
  const live = el("div");
  const head = el("div", "head");
  head.append(el("span", "state " + run.state, run.state));
  head.append(el("span", "title", run.title));
  const started = new Date(run.started).toLocaleTimeString();
  head.append(el("span", "time", started + " · " + duration(run.elapsed)));
  live.append(head);
  if (run.progress.length) {
    const bars = el("div", "bars");
    run.progress.forEach((node) => bars.append(renderBar(node)));
    live.append(bars);
  }
  if (run.summary) live.append(el("div", "summary", run.summary));
  if (run.error) live.append(el("div", "error", run.error));
  return live;
}

function updateCard(run) {
  let view = cards.get(run.id);
  if (!view) {
    view = { card: el("section", "run"), live: null, plan: null };
    cards.set(run.id, view);
  }
  const live = renderLive(run);
  if (view.live) view.live.replaceWith(live); else view.card.prepend(live);
  view.live = live;
  if (run.has_plan) {
    if (!view.plan) {
      view.plan = createPlan(run);
      view.card.append(view.plan.details);
    }
    updatePlan(view.plan, run);
  }
  return view.card;
}

function render(status) {
  const root = document.getElementById("runs");
  // The newest run shows its plan expanded once.
  const newest = status.runs[0];
  if (newest && newest.id !== newestSeen) {
    newestSeen = newest.id;
    openPlans.add(newest.id);
  }
  if (!status.runs.length) {
    cards.clear();
    root.replaceChildren(el("div", "empty", "No runs yet."));
    return;
  }
  const ids = new Set(status.runs.map((run) => run.id));
  for (const [id, view] of cards) {
    if (!ids.has(id)) {
      view.card.remove();
      cards.delete(id);
    }
  }
  const empty = root.querySelector(".empty");
  if (empty) empty.remove();
  status.runs.forEach((run, i) => {
    const card = updateCard(run);
    if (root.children[i] !== card) root.insertBefore(card, root.children[i] || null);
  });
}

async function poll() {
  const conn = document.getElementById("conn");
  try {
    render(await getStatus());
    conn.textContent = "live";
    conn.className = "";
  } catch (error) {
    conn.textContent = "disconnected (" + error.message + ")";
    conn.className = "lost";
  }
  setTimeout(poll, POLL_MS);
}

poll();
</script>
</body>
</html>

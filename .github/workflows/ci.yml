name: CI

on:
  push:
    branches: [ main, develop, next ]
  pull_request:
    branches: [ main, develop, next ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      # mypy checks src/examples too, so install the "examples" extra
      # (skrub, sklearn, numpy, ...). torch/torchvision are not needed:
      # mypy ignores their missing imports and no test imports them.
      run: uv sync --locked --extra examples

    - name: Run linting with Ruff
      run: |
        uv run --extra examples ruff check src/
        uv run --extra examples ruff format --check src/

    - name: Run type checking with mypy
      run: uv run --extra examples mypy src/

    - name: Run tests with pytest
      run: uv run --extra examples pytest --verbose

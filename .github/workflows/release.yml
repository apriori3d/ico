name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: The tag matches the version
      run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"

    - name: Build
      run: uv build

    - name: Smoke test the wheel
      run: |
        uv run --isolated --no-project --with dist/*.whl python -c \
          "from ico import IcoProcess, operator; step = operator()(lambda s: (s[1], s[0] + s[1])); assert IcoProcess(step, num_iterations=8)((0, 1))[0] == 21"

    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
      contents: write  # the GitHub release
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

    - name: GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes

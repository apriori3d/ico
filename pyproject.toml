[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "apriori-ico"
version = "0.1.2rc1"
description = "Computation flows from typed operators: described before they run, run in worker processes or on a cloud GPU, profiled and watched live."
readme = "README.md"
license = {text = "Apache 2.0"}
authors = [
    {name = "Sergei Shumilin", email = "shumilinss@gmail.com"}
]
maintainers = [
    {name = "Sergei Shumilin", email = "shumilinss@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
keywords = ["machine-learning", "pipeline", "type-safety", "functional-programming", "framework"]
requires-python = ">=3.10,<3.13"
dependencies = [
    "rich>=14.2.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
notebook = [
    "ipywidgets>=8.1.8",
]
examples = [
    "skrub (>=0.7.2,<0.8.0)",
    "pydot (>=4.0.1,<5.0.0)",
    "graphviz (>=0.21,<0.22)",
]
remote = [
    "boto3>=1.35",
]
vision = [
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "matplotlib>=3.10.7"
]

[project.scripts]
ico = "ico.cli:main"

[project.urls]
Homepage = "https://github.com/apriori3d/ico"
Documentation = "https://github.com/apriori3d/ico/blob/main/README.md"
Repository = "https://github.com/apriori3d/ico"
Issues = "https://github.com/apriori3d/ico/issues"

[dependency-groups]
dev = [
    "mypy>=1.18.2,<1.19",
    "ruff>=0.6.8,<0.7",
    "pytest>=8.3.3,<9",
    "pytest-xdist>=3.6.1,<4",
    "ipykernel>=7.2.0,<8",
    "pyright>=1.1.404,<1.1.409",
    "boto3>=1.35,<2",
    "moto[s3,server]>=5.1,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ico"]

[tool.hatch.build.targets.sdist]
include = ["/src/ico", "/README.md", "/LICENSE"]

[tool.uv]
# One version of a package for every Python, as the poetry lock had: mypy
# checks the code as Python 3.10, and newer numpy stubs need 3.12 syntax.
fork-strategy = "fewest"

# ───────────────────────────────────────────────
# Ruff
# ───────────────────────────────────────────────

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# ───────────────────────────────────────────────
# mypy
# ───────────────────────────────────────────────

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_no_return = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_any_expr = true
disallow_any_unimported = true
disallow_subclassing_any = true
show_error_codes = true

# Ignore Any-related errors for now
disable_error_code = ["misc", "redundant-cast", "unused-ignore"]

# this project uses namespace package from src/
mypy_path = "src"

namespace_packages = true
explicit_package_bases = true

plugins = []

# [[tool.mypy.overrides]]
# module = "apriori.ico.tools.progress.*"
# disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "examples.*"
disable_error_code = ["no-untyped-call", "no-any-return", "no-any-unimported"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "torchvision", "torchvision.*"]
ignore_missing_imports = true

# ───────────────────────────────────────────────
# pytest
# ───────────────────────────────────────────────

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["src/tests"]
addopts = "-v"